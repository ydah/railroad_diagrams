name: Build check
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master
    with:
      engine: cruby
      min_version: 2.5
  test:
    needs: ruby-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build and install gem
        run: |
          gem build railroad_diagrams.gemspec
          gem install --local --no-document --install-dir "$RUNNER_TEMP/railroad-gems" railroad_diagrams-*.gem
      - name: Run packaged CLI outside checkout
        run: |
          cd "$RUNNER_TEMP"
          GEM_HOME="$RUNNER_TEMP/railroad-gems" GEM_PATH="$RUNNER_TEMP/railroad-gems" \
            "$RUNNER_TEMP/railroad-gems/bin/railroad_diagrams" --format=ascii > /dev/null
