name: Build check
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@45f3750e656aa8f2d99910c02124f9e25d36b0db
    with:
      engine: cruby
      min_version: 2.5
  test:
    name: Gem build and CLI (Ruby ${{ matrix.ruby }})
    needs: ruby-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Build and install gem
        run: |
          gem build railroad_diagrams.gemspec
          gem install --local --no-document --install-dir "$RUNNER_TEMP/railroad-gems" railroad_diagrams-*.gem
      - name: Run packaged CLI outside checkout
        run: |
          cd "$RUNNER_TEMP"
          GEM_HOME="$RUNNER_TEMP/railroad-gems" GEM_PATH="$RUNNER_TEMP/railroad-gems" \
            "$RUNNER_TEMP/railroad-gems/bin/railroad_diagrams" --format=ascii > /dev/null
