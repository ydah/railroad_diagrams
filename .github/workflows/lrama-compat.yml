name: Lrama compatibility
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lrama_ref: [master, v0.8.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: railroad_diagrams
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ruby/lrama
          ref: ${{ matrix.lrama_ref }}
          path: lrama
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: railroad_diagrams
      - run: bundle exec rspec spec/compat/lrama_api_spec.rb
        working-directory: railroad_diagrams
      - run: ruby spec/compat/lrama_smoke.rb ../lrama
        working-directory: railroad_diagrams
