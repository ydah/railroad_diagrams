name: Steep type check
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  type-check:
    runs-on: ubuntu-latest
    env:
      INSTALL_STEEP: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run Steep check
        run: bundle exec steep check
      - name: Check generated signatures
        run: |
          bundle exec rbs-inline --output=sig/generated lib
          git diff --exit-code sig/generated
