name: Steep type check
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  type-check:
    runs-on: ubuntu-latest
    env:
      INSTALL_STEEP: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run Steep check
        run: bundle exec steep check
      - name: Check generated signatures
        run: |
          bundle exec rbs-inline --output=sig/generated lib
          git diff --exit-code sig/generated
